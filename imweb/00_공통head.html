.ovis-btn-ghost,.ovis-btn-ghost:link,.ovis-btn-ghost:visited{background:rgba(255,255,255,.07)!important;color:#FFFFFF!important;border-color:rgba(255,255,255,.24)!important}

.ovis-btn-primary,.ovis-btn-outline,.ovis-btn-dark,.ovis-svc,.ovis-svc-plus,.ovis-work{transition:transform .18s ease,background-color .18s ease,box-shadow .18s ease,border-color .18s ease,color .18s ease}
</style>

<script>
(function(){
  var RESET={
    'font-family':"Pretendard,'Apple SD Gothic Neo',system-ui,sans-serif",
    'border':'0',
    'background':'none',
    'text-transform':'none',
    'width':'auto',
    'max-width':'none',
    'display':'block'
  };
  function collect(el){
    if(el.__ovisCSS) return el.__ovisCSS;
    var raw=el.getAttribute('style')||'';
    var out={};
    var parts=raw.split(';');
    for(var i=0;i<parts.length;i++){
      var p=parts[i];
      var idx=p.indexOf(':');
      if(idx<1) continue;
      var k=p.slice(0,idx).trim();
      var v=p.slice(idx+1).replace('!important','').trim();
      if(k&&v) out[k]=v;
    }
    el.__ovisCSS=out;
    return out;
  }
  function imp(el,map){
    if(!el) return;
    for(var k in map){
      if(Object.prototype.hasOwnProperty.call(map,k)) el.style.setProperty(k,map[k],'important');
    }
  }
  function paintEl(el,withReset){
    var own=collect(el);
    if(withReset){
      for(var k in RESET){
        if(Object.prototype.hasOwnProperty.call(RESET,k)&&!(k in own)) el.style.setProperty(k,RESET[k],'important');
      }
    }
    imp(el,own);
  }
  function paint(){
    var hs=document.querySelectorAll('.ovis-h1');
    for(var i=0;i<hs.length;i++){
      paintEl(hs[i],true);
      var kids=hs[i].querySelectorAll('[style]');
      for(var j=0;j<kids.length;j++) paintEl(kids[j],false);
    }
  }
  function boot(){
    paint();
    var n=0;
    var timer=setInterval(function(){
      paint();
      n++;
      if(n>14) clearInterval(timer);
    },400);
  }
  if(document.readyState==='loading'){
    document.addEventListener('DOMContentLoaded',boot);
  }else{
    boot();
  }
  window.addEventListener('load',paint);
  window.addEventListener('resize',paint);
  window.addEventListener('pageshow',boot);
  window.OVIS_HEAD_VER='20260914-6';
})();
</script>
